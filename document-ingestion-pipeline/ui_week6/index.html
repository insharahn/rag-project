<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine-Tuning — Week 6</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f3ef;
    color: #2e2b27;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.topbar {
    background: #fffef9;
    border-bottom: 1.5px solid #e8e3db;
    padding: 0 20px;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
}
.topbar-title { font-size: 14px; font-weight: 600; color: #2e2b27; letter-spacing: -0.2px; }
.topbar-title span { color: #b490d4; }
.nav-links { display: flex; gap: 6px; margin-left: 12px; }
.nav-link {
    padding: 6px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: #7a7268; text-decoration: none; transition: background 0.15s, color 0.15s;
}
.nav-link:hover { background: #f0ede8; color: #2e2b27; }
.nav-link.active { background: #f3e8fb; color: #8452b0; font-weight: 600; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-status { font-size: 12px; color: #a8a098; }
.topbar-status.ok { color: #6a9a7a; }
.topbar-status.err { color: #c07060; }

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar {
    width: 200px;
    background: #eeeae3;
    border-right: 1.5px solid #e0dbd2;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.sidebar-hd {
    padding: 11px 14px;
    font-size: 10.5px;
    font-weight: 700;
    color: #a09888;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    border-bottom: 1px solid #ddd8cf;
}
.sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
.sidebar-item {
    padding: 9px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s, border-color 0.1s;
    font-size: 13px;
    color: #5a5248;
    user-select: none;
}
.sidebar-item:hover { background: #e5e0d8; }
.sidebar-item.active { background: #f3e8fb; border-left-color: #b490d4; font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 20px 28px 40px; background: #faf8f5; }
.content h1 { font-size: 22px; font-weight: 600; color: #2e2b27; margin-bottom: 4px; }
.content .subtitle { font-size: 14px; color: #a09888; margin-bottom: 20px; }
.content h2 {
    font-size: 17px; font-weight: 600; color: #3a3630;
    margin: 28px 0 14px 0; border-bottom: 1.5px solid #e8e3db; padding-bottom: 8px;
}
.content p { font-size: 13.5px; line-height: 1.7; color: #5a5248; margin-bottom: 10px; }

.note {
    background: #f8f5f0;
    border-left: 3px solid #b8b0a4;
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: #5a5248;
    margin: 10px 0 16px 0;
    line-height: 1.6;
}
.note.good { background: #f0faf4; border-left-color: #7aaa8f; }

.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 12px 0 18px 0; }
.metric-card {
    background: #fffef9;
    border: 1.5px solid #e8e3db;
    border-radius: 10px;
    padding: 14px 16px;
}
.metric-card .label { font-size: 10.5px; font-weight: 700; color: #a09888; text-transform: uppercase; letter-spacing: 0.4px; }
.metric-card .value { font-size: 26px; font-weight: 700; color: #2e2b27; line-height: 1.2; margin: 4px 0 2px 0; }
.metric-card .sub { font-size: 11.5px; color: #a09888; }
.metric-card.pink { border-color: #f3c6d6; background: #fef4f8; }
.metric-card.pink .label { color: #b0567f; }
.metric-card.pink .value { color: #9e3f6c; }
.metric-card.purple { border-color: #ddc6f0; background: #f8f2fc; }
.metric-card.purple .label { color: #8452b0; }
.metric-card.purple .value { color: #6e3a95; }
.metric-card.blue { border-color: #b3cde8; background: #f0f6fc; }
.metric-card.blue .label { color: #3a6186; }
.metric-card.blue .value { color: #2c5282; }

.chart-box { background: #fffef9; border: 1.5px solid #e8e3db; border-radius: 10px; padding: 8px 6px 4px 6px; margin: 6px 0 12px 0; }
.chart-box .chart-title { font-size: 13px; font-weight: 500; color: #4a4238; padding: 0 10px 4px 10px; }
.chart-container { width: 100%; min-height: 320px; }

.example-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
}
.example-card {
    background: #fffef9;
    border: 1.5px solid #e8e3db;
    border-radius: 10px;
    padding: 14px 16px;
}
.example-card.finetuned { border-color: #ddc6f0; background: #fdfbfe; }
.example-query {
    font-size: 12.5px; font-weight: 600; color: #3a3630;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eeeae3;
}
.example-label {
    display: inline-block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.4px;
    padding: 2px 8px; border-radius: 10px; margin-bottom: 8px;
}
.example-label.base { background: #eeeae3; color: #7a7268; }
.example-label.finetuned { background: #f3e8fb; color: #8452b0; }
.example-text { font-size: 12.5px; line-height: 1.65; color: #4a4238; direction: auto; }
.example-meta { font-size: 11px; color: #a09888; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eeeae3; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d4cfc8; border-radius: 3px; }

@media (max-width: 768px) {
    .sidebar { width: 140px; }
    .metric-grid { grid-template-columns: 1fr 1fr; }
    .example-pair { grid-template-columns: 1fr; }
    .content { padding: 14px 16px 30px; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-title">Fine-Tuning <span>Comparison</span></div>
    <div class="nav-links">
        <a class="nav-link" href="/ui">Week 1 · Ingestion</a>
        <a class="nav-link" href="/week2">Week 2 · Benchmark</a>
        <a class="nav-link" href="/week3">Week 3 · Advanced RAG</a>
        <a class="nav-link" href="/week4">Week 4 · Guardrails</a>
        <a class="nav-link" href="/week5">Week 5 · Multi-Agent RAG</a>
        <a class="nav-link active" href="/week6">Week 6 · Fine-Tuning</a>
    </div>
    <div class="topbar-right">
        <span class="topbar-status" id="status">Loading…</span>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-hd">Sections</div>
        <div class="sidebar-nav" id="sidebar-nav">
            <div class="sidebar-item active" data-section="overview">Overview</div>
            <div class="sidebar-item" data-section="highlights">Highlights</div>
        </div>
    </div>

    <div class="content">
        <div id="page-content"></div>
    </div>
</div>

<script>
const PASTEL = { blue: '#B1E6F3', pink: '#FFC2D1', purple: '#D4C4EC', green: '#D0F0C0' };

let data = null;
let queryKeys = [];

function citationCount(text) {
    const matches = text.match(/\[(\d+)\]/g);
    return matches ? new Set(matches).size : 0;
}

async function loadAll() {
    const statusEl = document.getElementById('status');
    try {
        const r = await fetch('/week6-data');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
        queryKeys = Object.keys(data.base_results).filter(q => q in data.finetuned_results);
        statusEl.textContent = 'Ready';
        statusEl.className = 'topbar-status ok';
        renderSection('overview');
    } catch (e) {
        statusEl.textContent = 'No data — run evaluation first';
        statusEl.className = 'topbar-status err';
        document.getElementById('page-content').innerHTML = `
            <div style="padding:40px;text-align:center;color:#b8b0a4;">
                <h2 style="font-weight:400;">No comparison results found</h2>
                <p style="margin-top:8px;">Run the evaluation notebook first.</p>
            </div>`;
    }
}

function computeStats() {
    const j = data.judge_results_gptoss;
    let baseCited = 0, ftCited = 0, baseGrounded = 0, ftGrounded = 0;
    let baseAddresses = 0, ftAddresses = 0, baseLatency = 0, ftLatency = 0;
    let baseCitationsTotal = 0, ftCitationsTotal = 0;

    for (const q of queryKeys) {
        const bAns = data.base_results[q].answer;
        const fAns = data.finetuned_results[q].answer;
        const bCites = citationCount(bAns);
        const fCites = citationCount(fAns);
        if (bCites > 0) baseCited++;
        if (fCites > 0) ftCited++;
        baseCitationsTotal += bCites;
        ftCitationsTotal += fCites;
        if (j[`base::${q}`]?.grounded) baseGrounded++;
        if (j[`finetuned::${q}`]?.grounded) ftGrounded++;
        if (j[`base::${q}`]?.addresses_query) baseAddresses++;
        if (j[`finetuned::${q}`]?.addresses_query) ftAddresses++;
        baseLatency += data.base_results[q].latency_seconds;
        ftLatency += data.finetuned_results[q].latency_seconds;
    }

    const n = queryKeys.length;
    return {
        n,
        citationRate: { base: baseCited / n, ft: ftCited / n },
        addressesRate: { base: baseAddresses / n, ft: ftAddresses / n },
        groundedRate: { base: baseGrounded / n, ft: ftGrounded / n },
        avgCitations: { base: baseCitationsTotal / n, ft: ftCitationsTotal / n },
        avgLatency: { base: baseLatency / n, ft: ftLatency / n },
    };
}

function pickHighlights() {
    const j = data.judge_results_gptoss;
    const ftRepeats = new Set(data.repetition_flags?.finetuned || []);
    const candidates = [];

    for (const q of queryKeys) {
        const fGrounded = j[`finetuned::${q}`]?.grounded;
        const fAddresses = j[`finetuned::${q}`]?.addresses_query;
        if (!fGrounded || !fAddresses || ftRepeats.has(q)) continue; // only genuinely clean fine-tuned answers

        const bAns = data.base_results[q].answer;
        const fAns = data.finetuned_results[q].answer;
        const bCites = citationCount(bAns);
        const fCites = citationCount(fAns);
        const bGrounded = j[`base::${q}`]?.grounded;
        const bAddresses = j[`base::${q}`]?.addresses_query;

        // a "win" = more citations, or base failed a judge check the fine-tuned answer passed
        const improvement = (fCites - bCites) + (bGrounded ? 0 : 2) + (bAddresses ? 0 : 2);
        if (improvement > 0) {
            candidates.push({ query: q, bAns, fAns, bCites, fCites, improvement });
        }
    }

    candidates.sort((a, b) => b.improvement - a.improvement);
    return candidates.slice(0, 3);
}

function renderSection(section) {
    document.querySelectorAll('.sidebar-item').forEach(el =>
        el.classList.toggle('active', el.dataset.section === section));
    if (!data) return;
    if (section === 'overview') renderOverview();
    else if (section === 'highlights') renderHighlights();
}

function renderOverview() {
    const s = computeStats();
    const html = [];
    html.push(`<h1>Fine-Tuning Comparison</h1>`);
    html.push(`<p class="subtitle">QLoRA fine-tuned Llama-3.1-8B-Instruct vs. the base model, on a ${s.n}-query held-out multilingual evaluation set.</p>`);

    html.push(`<div class="metric-grid">`);
    html.push(`<div class="metric-card purple"><div class="label">Citation Rate</div><div class="value">${(s.citationRate.ft*100).toFixed(0)}%</div><div class="sub">vs ${(s.citationRate.base*100).toFixed(0)}% base</div></div>`);
    html.push(`<div class="metric-card pink"><div class="label">Addresses Query</div><div class="value">${(s.addressesRate.ft*100).toFixed(0)}%</div><div class="sub">vs ${(s.addressesRate.base*100).toFixed(0)}% base</div></div>`);
    html.push(`<div class="metric-card blue"><div class="label">Avg Citations / Answer</div><div class="value">${s.avgCitations.ft.toFixed(1)}</div><div class="sub">vs ${s.avgCitations.base.toFixed(1)} base</div></div>`);
    html.push(`<div class="metric-card purple"><div class="label">Eval Set Size</div><div class="value">${s.n}</div><div class="sub">EN · UR · KO queries</div></div>`);
    html.push(`</div>`);

    html.push(`<div class="note good"><strong>Fine-tuning improved citation consistency and query relevance.</strong> The fine-tuned model cited a source in every answer and more often produced answers judged to directly address the question asked, compared to the base model.</div>`);

    html.push(`<h2>Base vs. fine-tuned</h2>`);
    const compData = [
        { metric: 'Citation rate', base: s.citationRate.base, finetuned: s.citationRate.ft },
        { metric: 'Addresses query', base: s.addressesRate.base, finetuned: s.addressesRate.ft },
        { metric: 'Judge grounded', base: s.groundedRate.base, finetuned: s.groundedRate.ft },
    ];
    html.push(makeChartDiv('comparison', 'Rate Comparison', compData, 'metric', ['base', 'finetuned']));

    html.push(`<p style="margin-top:20px; color:#a09888; font-size:12px;">See the full evaluation report for the complete comparison, including trade-offs around citation precision and latency.</p>`);

    document.getElementById('page-content').innerHTML = html.join('');
    renderAllCharts();
}

function renderHighlights() {
    const highlights = pickHighlights();
    const html = [];
    html.push(`<h1>Highlights</h1>`);
    html.push(`<p class="subtitle">Queries where the fine-tuned model's answer was more thorough, better cited, or more directly responsive than the base model's.</p>`);

    if (!highlights.length) {
        html.push(`<div class="note">No standout examples found in this eval set.</div>`);
    }

    for (const h of highlights) {
        html.push(`<h2 style="font-size:14px; border:none; margin-bottom:8px;">${esc(h.query)}</h2>`);
        html.push(`<div class="example-pair">
            <div class="example-card">
                <span class="example-label base">Base model</span>
                <div class="example-text">${esc(h.bAns.slice(0, 500))}${h.bAns.length > 500 ? '…' : ''}</div>
                <div class="example-meta">${h.bCites} citation${h.bCites === 1 ? '' : 's'}</div>
            </div>
            <div class="example-card finetuned">
                <span class="example-label finetuned">Fine-tuned model</span>
                <div class="example-text">${esc(h.fAns.slice(0, 500))}${h.fAns.length > 500 ? '…' : ''}</div>
                <div class="example-meta">${h.fCites} citation${h.fCites === 1 ? '' : 's'}</div>
            </div>
        </div>`);
    }

    document.getElementById('page-content').innerHTML = html.join('');
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeChartDiv(id, title, data, xKey, yKeys) {
    return `<div class="chart-box" id="chart-${id}">
        <div class="chart-title">${title}</div>
        <div class="chart-container" id="container-${id}"></div>
        <div style="display:none;" data-chart="${id}" data-x="${xKey}"
             data-y='${JSON.stringify(yKeys)}'>${JSON.stringify(data)}</div>
    </div>`;
}

function renderAllCharts() {
    requestAnimationFrame(() => {
        document.querySelectorAll('[data-chart]').forEach(el => {
            const id = el.dataset.chart;
            const container = document.getElementById(`container-${id}`);
            if (!container) return;
            const chartData = JSON.parse(el.textContent);
            const xKey = el.dataset.x;
            const yKeys = JSON.parse(el.dataset.y);
            renderBar(container, chartData, xKey, yKeys);
        });
    });
}

function renderBar(container, chartData, xKey, yKeys) {
    const colors = { base: '#B1E6F3', finetuned: '#D4C4EC' };
    const xVals = chartData.map(d => String(d[xKey]));

    const traces = yKeys.map(yk => ({
        x: xVals,
        y: chartData.map(d => d[yk] ?? 0),
        name: yk === 'finetuned' ? 'Fine-tuned' : 'Base',
        type: 'bar',
        text: chartData.map(d => ((d[yk] ?? 0) * 100).toFixed(0) + '%'),
        textposition: 'outside',
        marker: { color: colors[yk] },
    }));

    const layout = {
        plot_bgcolor: '#faf8f5', paper_bgcolor: '#faf8f5',
        font: { family: '-apple-system, sans-serif', size: 12 },
        margin: { t: 30, b: 50, l: 50, r: 30 },
        barmode: 'group',
        showlegend: true,
        legend: { bgcolor: 'rgba(0,0,0,0)', borderwidth: 0, orientation: 'h', y: 1.15 },
        xaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1 },
        yaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1, tickformat: '.0%', range: [0, 1.15] },
    };
    Plotly.newPlot(container, traces, layout, { responsive: true, displayModeBar: false });
}

document.getElementById('sidebar-nav').addEventListener('click', e => {
    const item = e.target.closest('.sidebar-item');
    if (item) renderSection(item.dataset.section);
});

loadAll();
</script>
</body>
</html>
