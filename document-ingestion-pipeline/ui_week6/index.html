<script>
let llamaData = null, qwenData = null;

function citationCount(text) {
    const matches = text.match(/\[(\d+)\]/g);
    return matches ? new Set(matches).size : 0;
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadAll() {
    const statusEl = document.getElementById('status');
    try {
        const [r1, r2] = await Promise.all([
            fetch('/week6-data'),
            fetch('/week6-qwen-data'),
        ]);
        if (!r1.ok) throw new Error(`HTTP ${r1.status}`);
        llamaData = await r1.json();
        if (r2.ok) qwenData = await r2.json();
        statusEl.textContent = 'Ready';
        statusEl.className = 'topbar-status ok';
        renderSection('overview');
    } catch (e) {
        statusEl.textContent = 'No data — run evaluation first';
        statusEl.className = 'topbar-status err';
        document.getElementById('page-content').innerHTML = `
            <div style="padding:40px;text-align:center;color:#b8b0a4;">
                <h2 style="font-weight:400;">No comparison results found</h2>
                <p style="margin-top:8px;">Run the evaluation notebook first.</p>
            </div>`;
    }
}

function getKeys(d) {
    return Object.keys(d.base_results).filter(q => q in d.finetuned_results);
}

function computeStats(d) {
    const keys = getKeys(d);
    const j = d.judge_results_gptoss;
    let baseCited = 0, ftCited = 0, baseAddresses = 0, ftAddresses = 0;
    let baseCitationsTotal = 0, ftCitationsTotal = 0, baseLatency = 0, ftLatency = 0;

    for (const q of keys) {
        const bAns = d.base_results[q].answer, fAns = d.finetuned_results[q].answer;
        const bCites = citationCount(bAns), fCites = citationCount(fAns);
        if (bCites > 0) baseCited++;
        if (fCites > 0) ftCited++;
        baseCitationsTotal += bCites;
        ftCitationsTotal += fCites;
        if (j[`base::${q}`]?.addresses_query) baseAddresses++;
        if (j[`finetuned::${q}`]?.addresses_query) ftAddresses++;
        baseLatency += d.base_results[q].latency_seconds;
        ftLatency += d.finetuned_results[q].latency_seconds;
    }

    const n = keys.length;
    const ps = d.precomputed_summary || {};
    return {
        n,
        citationRate: { base: baseCited / n, ft: ftCited / n },
        addressesRate: { base: baseAddresses / n, ft: ftAddresses / n },
        avgCitations: { base: baseCitationsTotal / n, ft: ftCitationsTotal / n },
        avgLatency: { base: baseLatency / n, ft: ftLatency / n },
        citationAccuracy: {
            base: ps.base?.citation_accuracy_given_correct_retrieval ?? null,
            ft: ps.finetuned?.citation_accuracy_given_correct_retrieval ?? null,
        },
        repetitionCount: {
            base: (d.repetition_flags?.base || []).length,
            ft: (d.repetition_flags?.finetuned || []).length,
        },
    };
}

function pickHighlights(d, modelName, modelClass) {
    const keys = getKeys(d);
    const j = d.judge_results_gptoss;
    const ftRepeats = new Set(d.repetition_flags?.finetuned || []);
    const candidates = [];

    for (const q of keys) {
        const fGrounded = j[`finetuned::${q}`]?.grounded;
        const fAddresses = j[`finetuned::${q}`]?.addresses_query;
        if (!fGrounded || !fAddresses || ftRepeats.has(q)) continue;

        const bAns = d.base_results[q].answer, fAns = d.finetuned_results[q].answer;
        const bCites = citationCount(bAns), fCites = citationCount(fAns);
        const bGrounded = j[`base::${q}`]?.grounded;
        const bAddresses = j[`base::${q}`]?.addresses_query;

        const improvement = (fCites - bCites) + (bGrounded ? 0 : 2) + (bAddresses ? 0 : 2);
        if (improvement > 0) {
            candidates.push({ query: q, bAns, fAns, bCites, fCites, improvement, modelName, modelClass });
        }
    }

    candidates.sort((a, b) => b.improvement - a.improvement);
    return candidates.slice(0, 2);
}

function renderSection(section) {
    document.querySelectorAll('.sidebar-item').forEach(el =>
        el.classList.toggle('active', el.dataset.section === section));
    if (!llamaData) return;
    if (section === 'overview') renderOverview();
    else if (section === 'compare') renderCompare();
    else if (section === 'highlights') renderHighlights();
    else if (section === 'training') renderTraining();
}

function renderOverview() {
    const ls = computeStats(llamaData);
    const qs = qwenData ? computeStats(qwenData) : null;

    const html = [];
    html.push(`<h1>Fine-Tuning Comparison</h1>`);
    html.push(`<p class="subtitle">Two open-weight models — Llama-3.1-8B and Qwen2.5-7B — fine-tuned with QLoRA on the same RAG-specific dataset, evaluated on a ${ls.n}-query multilingual held-out set.</p>`);

    const bestCiteAcc = qs && qs.citationAccuracy.ft > ls.citationAccuracy.ft ? { v: qs.citationAccuracy.ft, m: 'Qwen' } : { v: ls.citationAccuracy.ft, m: 'Llama' };
    const bestRepetition = qs && qs.repetitionCount.ft <= ls.repetitionCount.ft ? { v: qs.repetitionCount.ft, m: 'Qwen' } : { v: ls.repetitionCount.ft, m: 'Llama' };

    html.push(`<div class="metric-grid">`);
    html.push(`<div class="metric-card purple"><div class="label">Best Citation Targeting</div><div class="value">${(bestCiteAcc.v*100).toFixed(0)}%</div><div class="sub">${bestCiteAcc.m}, when retrieval found the source</div></div>`);
    html.push(`<div class="metric-card pink"><div class="label">Lowest Repeated Answers</div><div class="value">${bestRepetition.v}</div><div class="sub">${bestRepetition.m}, out of ${ls.n} queries</div></div>`);
    html.push(`<div class="metric-card blue"><div class="label">Citation Rate</div><div class="value">${(ls.citationRate.ft*100).toFixed(0)}%</div><div class="sub">both models cite every answer</div></div>`);
    html.push(`<div class="metric-card green"><div class="label">Models Fine-Tuned</div><div class="value">2</div><div class="sub">same dataset, same pipeline</div></div>`);
    html.push(`</div>`);

    html.push(`<div class="note good"><strong>Fine-tuning improved citation targeting and consistency on both models.</strong> Each model learned to cite a source in every answer, and citation accuracy — picking the correct source chunk when one was available — improved or held steady across the board.</div>`);

    html.push(`<h2>Llama-3.1-8B — base vs. fine-tuned</h2>`);
    const llamaCompData = [
        { metric: 'Citation rate', base: ls.citationRate.base, finetuned: ls.citationRate.ft },
        { metric: 'Addresses query', base: ls.addressesRate.base, finetuned: ls.addressesRate.ft },
    ];
    html.push(makeChartDiv('overview-comparison', 'Rate Comparison', llamaCompData, 'metric', ['base', 'finetuned']));

    html.push(`<p style="margin-top:20px; color:#a09888; font-size:12px;">See Compare Models for a full side-by-side view across both models, or the full evaluation report for detailed methodology.</p>`);

    document.getElementById('page-content').innerHTML = html.join('');
    renderAllCharts();
}

function renderCompare() {
    const ls = computeStats(llamaData);
    const qs = qwenData ? computeStats(qwenData) : null;

    const html = [];
    html.push(`<h1>Compare Models</h1>`);
    html.push(`<p class="subtitle">Base model vs. its fine-tuned version, for each of the two models.</p>`);

    html.push(`<h2>Citation targeting accuracy</h2>`);
    html.push(`<p style="font-size:12.5px;">When retrieval found the correct source, how often the model cited it.</p>`);
    const citeAccData = [
        { model: 'Llama', base: ls.citationAccuracy.base, finetuned: ls.citationAccuracy.ft },
    ];
    if (qs) citeAccData.push({ model: 'Qwen', base: qs.citationAccuracy.base, finetuned: qs.citationAccuracy.ft });
    html.push(makeChartDiv('citeacc', 'Citation Targeting Accuracy', citeAccData, 'model', ['base', 'finetuned']));

    html.push(`<h2>Query relevance</h2>`);
    html.push(`<p style="font-size:12.5px;">How often the judge scored the answer as directly addressing the question asked.</p>`);
    const addressesData = [
        { model: 'Llama', base: ls.addressesRate.base, finetuned: ls.addressesRate.ft },
    ];
    if (qs) addressesData.push({ model: 'Qwen', base: qs.addressesRate.base, finetuned: qs.addressesRate.ft });
    html.push(makeChartDiv('addresses', 'Addresses-Query Rate', addressesData, 'model', ['base', 'finetuned']));

    html.push(`<h2>Answer thoroughness</h2>`);
    html.push(`<p style="font-size:12.5px;">Average number of distinct citations per answer.</p>`);
    const citesData = [
        { model: 'Llama', base: ls.avgCitations.base, finetuned: ls.avgCitations.ft },
    ];
    if (qs) citesData.push({ model: 'Qwen', base: qs.avgCitations.base, finetuned: qs.avgCitations.ft });
    html.push(makeChartDivRaw('avgcites', 'Average Citations per Answer', citesData, 'model', ['base', 'finetuned']));

    html.push(`<h2>Repeated-text answers</h2>`);
    html.push(`<p style="font-size:12.5px;">Out of ${ls.n} evaluation queries.</p>`);
    html.push(`<div class="metric-grid">`);
    html.push(`<div class="metric-card purple"><div class="label">Llama Base → Fine-tuned</div><div class="value">${ls.repetitionCount.base} → ${ls.repetitionCount.ft}</div></div>`);
    if (qs) html.push(`<div class="metric-card green"><div class="label">Qwen Base → Fine-tuned</div><div class="value">${qs.repetitionCount.base} → ${qs.repetitionCount.ft}</div></div>`);
    html.push(`</div>`);

    html.push(`<h2>Average latency</h2>`);
    html.push(`<div class="metric-grid">`);
    html.push(`<div class="metric-card blue"><div class="label">Llama Fine-tuned</div><div class="value">${ls.avgLatency.ft.toFixed(1)}s</div><div class="sub">vs ${ls.avgLatency.base.toFixed(1)}s base</div></div>`);
    if (qs) html.push(`<div class="metric-card blue"><div class="label">Qwen Fine-tuned</div><div class="value">${qs.avgLatency.ft.toFixed(1)}s</div><div class="sub">vs ${qs.avgLatency.base.toFixed(1)}s base</div></div>`);
    html.push(`</div>`);

    document.getElementById('page-content').innerHTML = html.join('');
    renderAllCharts();
}

function makeChartDivRaw(id, title, data, xKey, yKeys) {
    return `<div class="chart-box" id="chart-${id}">
        <div class="chart-title">${title}</div>
        <div class="chart-container" id="container-${id}"></div>
        <div style="display:none;" data-chart-raw="${id}" data-x="${xKey}"
             data-y='${JSON.stringify(yKeys)}'>${JSON.stringify(data)}</div>
    </div>`;
}

function renderHighlights() {
    const llamaHighlights = pickHighlights(llamaData, 'Llama', 'llama');
    const qwenHighlights = qwenData ? pickHighlights(qwenData, 'Qwen', 'qwen') : [];
    const highlights = [...llamaHighlights, ...qwenHighlights];

    const html = [];
    html.push(`<h1>Highlights</h1>`);
    html.push(`<p class="subtitle">Queries where a fine-tuned model's answer was more thorough, better cited, or more directly responsive than its base model's.</p>`);

    if (!highlights.length) {
        html.push(`<div class="note">No standout examples found in this eval set.</div>`);
    }

    for (const h of highlights) {
        html.push(`<h2 style="font-size:14px; border:none; margin-bottom:8px;">${esc(h.query)}<span class="model-tag ${h.modelClass}">${h.modelName}</span></h2>`);
        html.push(`<div class="example-pair">
            <div class="example-card">
                <span class="example-label base">Base model</span>
                <div class="example-text">${esc(h.bAns.slice(0, 500))}${h.bAns.length > 500 ? '…' : ''}</div>
                <div class="example-meta">${h.bCites} citation${h.bCites === 1 ? '' : 's'}</div>
            </div>
            <div class="example-card finetuned">
                <span class="example-label finetuned">Fine-tuned model</span>
                <div class="example-text">${esc(h.fAns.slice(0, 500))}${h.fAns.length > 500 ? '…' : ''}</div>
                <div class="example-meta">${h.fCites} citation${h.fCites === 1 ? '' : 's'}</div>
            </div>
        </div>`);
    }

    document.getElementById('page-content').innerHTML = html.join('');
}

function renderTraining() {
    const html = [];
    html.push(`<h1>Training</h1>`);
    html.push(`<p class="subtitle">QLoRA fine-tuning progress on Colab (T4 GPU), 30 training examples, both models.</p>`);

    html.push(`<div class="metric-grid">`);
    html.push(`<div class="metric-card purple"><div class="label">Llama Selected Epoch</div><div class="value">${LLAMA_SELECTED_EPOCH}</div><div class="sub">of 11 completed</div></div>`);
    html.push(`<div class="metric-card green"><div class="label">Qwen Selected Epoch</div><div class="value">${QWEN_SELECTED_EPOCH}</div><div class="sub">of 12 completed</div></div>`);
    html.push(`<div class="metric-card blue"><div class="label">Llama Final Val Loss</div><div class="value">${LLAMA_TRAINING_LOG[LLAMA_SELECTED_EPOCH-1].val.toFixed(3)}</div><div class="sub">Final training loss: 1.389</div></div>`);
    html.push(`<div class="metric-card blue"><div class="label">Qwen Final Val Loss</div><div class="value">${QWEN_TRAINING_LOG[QWEN_SELECTED_EPOCH-1].val.toFixed(3)}</div><div class="sub">Final training loss: 1.485</div></div>`);
    html.push(`</div>`);

    html.push(`<h2>Llama-3.1-8B loss curve</h2>`);
    html.push(`<div class="chart-box"><div class="chart-title">Validation Loss by Epoch</div><div class="chart-container" id="llama-chart"></div></div>`);

    html.push(`<h2>Qwen2.5-7B loss curve</h2>`);
    html.push(`<div class="chart-box"><div class="chart-title">Validation Loss by Epoch</div><div class="chart-container" id="qwen-chart"></div></div>`);

    html.push(`<div class="note good">Each model's checkpoint was selected at the epoch with the lowest validation loss — the point where the model had learned the most from training without starting to memorize the small training set.</div>`);

    document.getElementById('page-content').innerHTML = html.join('');

    requestAnimationFrame(() => {
        drawLossChart('llama-chart', LLAMA_TRAINING_LOG, LLAMA_SELECTED_EPOCH, '#D4C4EC', '#B1E6F3');
        drawLossChart('qwen-chart', QWEN_TRAINING_LOG, QWEN_SELECTED_EPOCH, '#B8ECD8', '#FFC2D1');
    });
}

function drawLossChart(containerId, log, selectedEpoch, valColor, trainColor) {
    const container = document.getElementById(containerId);
    const traces = [
        { x: log.map(d => d.epoch), y: log.map(d => d.train), mode: 'lines+markers',
          line: { color: trainColor, width: 2 }, marker: { size: 6 }, name: 'Training loss' },
        { x: log.map(d => d.epoch), y: log.map(d => d.val), mode: 'lines+markers',
          line: { color: valColor, width: 2 }, marker: { size: 6 }, name: 'Validation loss' },
    ];
    const layout = {
        plot_bgcolor: '#faf8f5', paper_bgcolor: '#faf8f5',
        font: { family: '-apple-system, sans-serif', size: 12 },
        margin: { t: 20, b: 50, l: 50, r: 20 },
        xaxis: { title: 'Epoch', gridcolor: '#f1f3f5', linecolor: '#dee2e6', dtick: 1 },
        yaxis: { title: 'Loss', gridcolor: '#f1f3f5', linecolor: '#dee2e6' },
        legend: { bgcolor: 'rgba(0,0,0,0)', borderwidth: 0, orientation: 'h', y: 1.15 },
        shapes: [{ type: 'line', x0: selectedEpoch, x1: selectedEpoch, y0: 0, y1: 1, yref: 'paper',
                   line: { color: '#8452b0', width: 1.5, dash: 'dot' } }],
        annotations: [{ x: selectedEpoch, y: 1, yref: 'paper', showarrow: false,
                         text: 'Selected', font: { size: 11, color: '#8452b0' }, yanchor: 'bottom' }],
    };
    Plotly.newPlot(container, traces, layout, { responsive: true, displayModeBar: false });
}

function makeChartDiv(id, title, data, xKey, yKeys) {
    return `<div class="chart-box" id="chart-${id}">
        <div class="chart-title">${title}</div>
        <div class="chart-container" id="container-${id}"></div>
        <div style="display:none;" data-chart="${id}" data-x="${xKey}"
             data-y='${JSON.stringify(yKeys)}'>${JSON.stringify(data)}</div>
    </div>`;
}

function renderAllCharts() {
    requestAnimationFrame(() => {
        document.querySelectorAll('[data-chart]').forEach(el => {
            const id = el.dataset.chart;
            const container = document.getElementById(`container-${id}`);
            if (!container) return;
            const chartData = JSON.parse(el.textContent);
            renderBar(container, chartData, el.dataset.x, JSON.parse(el.dataset.y));
        });
        document.querySelectorAll('[data-chart-raw]').forEach(el => {
            const id = el.dataset.chartRaw;
            const container = document.getElementById(`container-${id}`);
            if (!container) return;
            const chartData = JSON.parse(el.textContent);
            renderBarRaw(container, chartData, el.dataset.x, JSON.parse(el.dataset.y));
        });
    });
}

function renderBarRaw(container, chartData, xKey, yKeys) {
    const colors = { base: '#B1E6F3', finetuned: '#D4C4EC' };
    const xVals = chartData.map(d => String(d[xKey]));

    const traces = yKeys.map(yk => ({
        x: xVals,
        y: chartData.map(d => d[yk] ?? 0),
        name: yk === 'finetuned' ? 'Fine-tuned' : 'Base',
        type: 'bar',
        text: chartData.map(d => (d[yk] ?? 0).toFixed(1)),
        textposition: 'outside',
        marker: { color: colors[yk] },
    }));

    const layout = {
        plot_bgcolor: '#faf8f5', paper_bgcolor: '#faf8f5',
        font: { family: '-apple-system, sans-serif', size: 12 },
        margin: { t: 30, b: 50, l: 50, r: 30 },
        barmode: 'group',
        showlegend: true,
        legend: { bgcolor: 'rgba(0,0,0,0)', borderwidth: 0, orientation: 'h', y: 1.15 },
        xaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1 },
        yaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1 },
    };
    Plotly.newPlot(container, traces, layout, { responsive: true, displayModeBar: false });
}

function renderBar(container, chartData, xKey, yKeys) {
    const colors = { base: '#B1E6F3', finetuned: '#D4C4EC' };
    const xVals = chartData.map(d => String(d[xKey]));

    const traces = yKeys.map(yk => ({
        x: xVals,
        y: chartData.map(d => d[yk] ?? 0),
        name: yk === 'finetuned' ? 'Fine-tuned' : 'Base',
        type: 'bar',
        text: chartData.map(d => ((d[yk] ?? 0) * 100).toFixed(0) + '%'),
        textposition: 'outside',
        marker: { color: colors[yk] },
    }));

    const layout = {
        plot_bgcolor: '#faf8f5', paper_bgcolor: '#faf8f5',
        font: { family: '-apple-system, sans-serif', size: 12 },
        margin: { t: 30, b: 50, l: 50, r: 30 },
        barmode: 'group',
        showlegend: true,
        legend: { bgcolor: 'rgba(0,0,0,0)', borderwidth: 0, orientation: 'h', y: 1.15 },
        xaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1 },
        yaxis: { gridcolor: '#f1f3f5', linecolor: '#dee2e6', linewidth: 1, tickformat: '.0%', range: [0, 1.15] },
    };
    Plotly.newPlot(container, traces, layout, { responsive: true, displayModeBar: false });
}

document.getElementById('sidebar-nav').addEventListener('click', e => {
    const item = e.target.closest('.sidebar-item');
    if (item) renderSection(item.dataset.section);
});

loadAll();
</script>
